<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mindwave</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="vercel-toolbar" content="false">

    <!-- SEO & Open Graph -->
    <meta name="title" content="Mindwave — Your Memory Across Every AI">
    <meta name="description" content="Never repeat yourself to AI again. Voice to perfect prompt. AI Passport. Session Sync across ChatGPT, Claude, Gemini. Free forever.">
    <meta name="keywords" content="AI prompt generator, voice to prompt, AI memory, ChatGPT prompt builder, AI passport, session sync, continue AI conversation">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mindwave-omega-three.vercel.app">
    <meta property="og:title" content="Mindwave — Your Memory Across Every AI">
    <meta property="og:description" content="Never repeat yourself to AI again.">
    <meta property="og:image" content="/logo/mindwave-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mindwave — Your Memory Across Every AI">
    <meta name="twitter:description" content="Never repeat yourself to AI again.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans">
    
    <header class="p-8 flex items-center justify-between max-w-6xl mx-auto w-full">
        <a href="index.html" class="flex items-center gap-2">
            <span class="material-symbols-outlined text-white">waves</span>
            <span class="font-bold tracking-tight">MindWave</span>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-bold tracking-tight">Welcome back.</h1>
                <p class="text-gray-400 text-sm font-light">Sign in to access your persistent AI memory.</p>
            </div>

            <div class="space-y-4">
                <!-- Email Form -->
                <form id="login-form" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500 uppercase ml-1">Email Address</label>
                        <input type="email" id="email" required class="w-full bg-[#111111] border border-[#222222] rounded-xl px-4 py-3 focus:border-white outline-none transition-colors" placeholder="alex@example.com">
                    </div>
                    <button type="submit" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform mt-2">Continue with Email</button>
                </form>

                <!-- OTP Form (Hidden initially) -->
                <form id="otp-form" class="space-y-4 hidden animate-in slide-in-from-right duration-300">
                    <div class="space-y-2 text-center pb-2">
                        <p class="text-xs text-gray-400">We've sent a 6-digit code to <span id="display-email" class="text-white font-medium"></span></p>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500 uppercase ml-1">Enter 6-digit code</label>
                        <input type="text" id="otp-code" required maxlength="6" pattern="[0-9]*" inputmode="numeric" class="w-full bg-[#111111] border border-[#222222] rounded-xl px-4 py-3 focus:border-white outline-none transition-colors text-center text-2xl tracking-[0.5em] font-mono" placeholder="000000">
                    </div>
                    <button type="submit" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform mt-2">Verify & Login</button>
                    <button type="button" id="back-btn" class="w-full text-gray-500 text-[10px] font-bold uppercase tracking-widest hover:text-white transition-colors">Change Email</button>
                </form>

                <div class="flex items-center gap-4 py-2">
                    <div class="h-px flex-1 bg-[#222222]"></div>
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">or</span>
                    <div class="h-px flex-1 bg-[#222222]"></div>
                </div>

                <!-- Google Sign In -->
                <button id="google-login-btn" class="w-full bg-[#111111] border border-[#222222] text-white font-medium py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-[#222222] transition-colors">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google Login
                </button>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center text-xs text-gray-600">
        &copy; 2026 MystryX. All rights reserved.
    </footer>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full font-bold shadow-2xl opacity-0 translate-y-20 transition-all duration-300 z-[100]"></div>

    <script type="module">
        import { signInWithGoogle, requestOtp, verifyOtp, getCurrentUser, supabase } from './js/auth.js';
        import { $, showToast } from './js/app.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await getCurrentUser();
            if (user) {
                window.location.href = '/dashboard.html';
                return;
            }
            
            let userEmail = '';

            // Step 1: Request OTP
            $('login-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                userEmail = $('email').value;
                const btn = e.target.querySelector('button');

                try {
                    btn.textContent = 'Sending Code...';
                    btn.disabled = true;
                    await requestOtp(userEmail);
                    
                    // Show OTP form
                    $('login-form').classList.add('hidden');
                    $('otp-form').classList.remove('hidden');
                    $('display-email').textContent = userEmail;
                    showToast('✅ Code sent to ' + userEmail);
                } catch (err) {
                    showToast('❌ Failed: ' + err.message);
                    btn.textContent = 'Continue with Email';
                    btn.disabled = false;
                }
            });

            // Step 2: Verify OTP
            $('otp-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const code = $('otp-code').value;
                const btn = e.target.querySelector('button');

                try {
                    btn.textContent = 'Verifying...';
                    btn.disabled = true;
                    
                    const { data } = await verifyOtp(userEmail, code);
                    
                    if (data?.user) {
                        showToast('✅ Verified! Entering MindWave...');
                        
                        // Check if onboarding is needed
                        const { data: profile } = await supabase.from('profiles')
                            .select('onboarding_completed')
                            .eq('id', data.user.id)
                            .single();
                        
                        if (!profile || !profile.onboarding_completed) {
                            window.location.href = '/onboarding.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    }
                } catch (err) {
                    showToast('❌ Invalid code: ' + err.message);
                    btn.textContent = 'Verify & Login';
                    btn.disabled = false;
                }
            });

            // Back button
            $('back-btn')?.addEventListener('click', () => {
                $('otp-form').classList.add('hidden');
                $('login-form').classList.remove('hidden');
            });

            $('google-login-btn')?.addEventListener('click', async () => {
                try {
                    showToast('Redirecting to Google...');
                    await signInWithGoogle();
                } catch (err) {
                    showToast('❌ Google Login failed: ' + err.message);
                }
            });
        });
    </script>
</body>
</html>
